<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Web Battle Royale Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
    #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

    /* HUD Overlay */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 5; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .top-bar { display: flex; justify-content: space-between; font-weight: bold; color: #fff; font-size: 18px; text-shadow: 1px 1px 4px #000; }
    .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); }
    
    .bottom-bar { display: flex; align-items: flex-end; justify-content: space-between; }
    .health-container { width: 300px; background: rgba(0, 0, 0, 0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
    .bar-label { color: #aaa; font-size: 12px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bar-outer { width: 100%; height: 14px; background: #333; border-radius: 7px; overflow: hidden; margin-bottom: 8px; }
    .bar-inner-hp { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s; }
    .bar-inner-ep { width: 100%; height: 100%; background: #f39c12; transition: width 0.2s; }

    .controls-hint { background: rgba(0,0,0,0.6); color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    
    /* Start Overlay */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; z-index: 20; cursor: pointer; text-align: center;
    }
    #start-screen h1 { font-size: 42px; margin-bottom: 10px; color: #f39c12; letter-spacing: 2px; }
    #start-screen p { font-size: 18px; color: #ccc; }

    /* Damage Floating Popups */
    .damage-popup {
      position: absolute; font-weight: 900; font-size: 24px; pointer-events: none;
      animation: popup 0.8s ease-out forwards; text-shadow: 2px 2px 0px #000;
    }
    @keyframes popup {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
    }
  </style>
  <!-- Load Three.js Library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div class="top-bar">
      <div class="stat-box">Kills: <span id="kill-count">0</span></div>
      <div class="stat-box" style="color: #e74c3c;">Safe Zone Shrinking in: <span id="zone-timer">60</span>s</div>
      <div class="stat-box">Alive: <span id="alive-count">5</span></div>
    </div>
    
    <div class="bottom-bar">
      <div class="health-container">
        <div class="bar-label"><span>HP</span><span id="hp-text">100 / 100</span></div>
        <div class="bar-outer"><div id="hp-bar" class="bar-inner-hp"></div></div>
        <div class="bar-label"><span>EP</span><span id="ep-text">100 / 100</span></div>
        <div class="bar-outer"><div id="ep-bar" class="bar-inner-ep"></div></div>
      </div>
      
      <div class="controls-hint">
        <b>Controls:</b><br/>
        [W,A,S,D] Move | [Mouse] Aim<br/>
        [Left Click] Shoot | [F] Deploy Gloo Wall<br/>
        [Space] Jump | [Shift] Sprint
      </div>
    </div>
  </div>

  <div id="start-screen">
    <h1>WEB BATTLE ROYALE</h1>
    <p>Click Anywhere to Start & Lock Pointer</p>
  </div>

  <script>
    // --- 1. GAME STATE & VARIABLES ---
    let scene, camera, renderer;
    let player, playerVelocity = new THREE.Vector3();
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false, canJump = true;
    
    let isLocked = false;
    let yaw = 0, pitch = 0;
    
    let hp = 100, maxHp = 100, ep = 100;
    let kills = 0;
    let aliveCount = 5;
    let zoneTimer = 60;
    let zoneRadius = 150;
    let zoneMesh;
    
    const bots = [];
    const glooWalls = [];
    const raycaster = new THREE.Raycaster();
    const clock = new THREE.Clock();

    // --- 2. INITIALIZE SCENE ---
    function init() {
      const container = document.getElementById('canvas-container');
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Sky blue
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(100, 150, 50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Ground (Map Terrain)
      const groundGeo = new THREE.PlaneGeometry(500, 500);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 }); // Grass Green
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Player Object (Represented as a 3D Character Capsule)
      player = new THREE.Group();
      const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3498db });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 0.9;
      bodyMesh.castShadow = true;
      player.add(bodyMesh);

      // Head Mesh (for hit registration reference)
      const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const headMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f });
      const headMesh = new THREE.Mesh(headGeo, headMat);
      headMesh.position.y = 1.9;
      player.add(headMesh);

      player.position.set(0, 0, 0);
      scene.add(player);

      // Safe Zone Cylinder (Glowing Barrier)
      const zoneGeo = new THREE.CylinderGeometry(zoneRadius, zoneRadius, 100, 32, 1, true);
      const zoneMat = new THREE.MeshBasicMaterial({ color: 0x3498db, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
      zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
      zoneMesh.position.y = 50;
      scene.add(zoneMesh);

      // Spawn Enemy Bots & Obstacles
      spawnMapStructures();
      spawnBots(4);

      // Event Listeners
      setupControls();
      window.addEventListener('resize', onWindowResize);

      // Start Safe Zone Countdown Loop
      setInterval(updateZoneTimer, 1000);

      // Animation Loop
      animate();
    }

    // --- 3. MAP BUILDINGS & STRUCTURES ---
    function spawnMapStructures() {
      for (let i = 0; i < 25; i++) {
        const width = 8 + Math.random() * 8;
        const height = 6 + Math.random() * 10;
        const depth = 8 + Math.random() * 8;
        
        const geo = new THREE.BoxGeometry(width, height, depth);
        const mat = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });
        const building = new THREE.Mesh(geo, mat);

        const x = (Math.random() - 0.5) * 350;
        const z = (Math.random() - 0.5) * 350;
        
        // Avoid spawning right on the player start position
        if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;

        building.position.set(x, height / 2, z);
        building.castShadow = true;
        building.receiveShadow = true;
        scene.add(building);
      }
    }

    // --- 4. ENEMY BOTS SPAWNER ---
    function spawnBots(count) {
      for (let i = 0; i < count; i++) {
        const botGroup = new THREE.Group();
        
        // Body (Body Hitbox)
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        body.name = "body";
        botGroup.add(body);

        // Head (Headshot Hitbox)
        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMat = new THREE.MeshLambertMaterial({ color: 0xe67e22 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.9;
        head.name = "head";
        botGroup.add(head);

        const x = (Math.random() - 0.5) * 200;
        const z = (Math.random() - 0.5) * 200;
        botGroup.position.set(x, 0, z);

        botGroup.userData = { hp: 100, speed: 2 + Math.random() * 2, dirX: Math.random() - 0.5, dirZ: Math.random() - 0.5 };
        
        scene.add(botGroup);
        bots.push(botGroup);
      }
    }

    // --- 5. GLOO WALL MECHANIC ---
    function deployGlooWall() {
      const wallGeo = new THREE.BoxGeometry(6, 4, 0.5);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3, roughness: 0.2, metalness: 0.5, transparent: true, opacity: 0.85 });
      const wall = new THREE.Mesh(wallGeo, wallMat);

      // Position Gloo Wall 3 meters in front of the player's facing angle
      const forwardDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const spawnPos = player.position.clone().add(forwardDir.multiplyScalar(3.5));
      
      wall.position.set(spawnPos.x, 2, spawnPos.z);
      wall.rotation.y = yaw;
      wall.castShadow = true;
      
      scene.add(wall);
      glooWalls.push(wall);
    }

    // --- 6. SHOOTING & RAYCASTING (Headshot vs Body Shot) ---
    function shoot() {
      if (!isLocked) return;

      // Raycast from Camera Center
      const rayDir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
      raycaster.set(camera.position, rayDir);

      // Collect target hitboxes
      const targetObjects = [];
      bots.forEach(bot => {
        bot.children.forEach(child => targetObjects.push(child));
      });

      const intersects = raycaster.intersectObjects(targetObjects);

      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        const botGroup = hitObject.parent;

        let damage = 25;
        let isHeadshot = false;

        if (hitObject.name === "head") {
          damage = 85; // Headshot multiplier
          isHeadshot = true;
        }

        botGroup.userData.hp -= damage;
        showDamagePopup(intersects[0].point, damage, isHeadshot);

        // Check Death
        if (botGroup.userData.hp <= 0) {
          scene.remove(botGroup);
          const index = bots.indexOf(botGroup);
          if (index > -1) bots.splice(index, 1);
          
          kills++;
          aliveCount--;
          document.getElementById('kill-count').innerText = kills;
          document.getElementById('alive-count').innerText = aliveCount;

          if (aliveCount <= 1) {
            alert("BOOYAH! Victory! Total Kills: " + kills);
          }
        }
      }
    }

    function showDamagePopup(position, damage, isHeadshot) {
      const popup = document.createElement('div');
      popup.className = 'damage-popup';
      popup.innerText = damage;
      popup.style.color = isHeadshot ? '#e74c3c' : '#f1c40f'; // Red for Headshot, Yellow for Body

      // Project 3D position to 2D screen coordinates
      const vector = position.clone().project(camera);
      const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      document.body.appendChild(popup);

      setTimeout(() => popup.remove(), 800);
    }

    // --- 7. INPUT & POINTER LOCK CONTROLS ---
    function setupControls() {
      const startScreen = document.getElementById('start-screen');

      startScreen.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isLocked = true;
          startScreen.style.display = 'none';
        } else {
          isLocked = false;
          startScreen.style.display = 'flex';
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!isLocked) return;
        const sensitivity = 0.0025;
        yaw -= e.movementX * sensitivity;
        pitch -= e.movementY * sensitivity;

        // Limit Pitch (looking up/down bounds)
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      });

      document.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'ShiftLeft': isSprinting = true; break;
          case 'Space': 
            if (canJump) { playerVelocity.y = 8; canJump = false; } 
            break;
          case 'KeyF': deployGlooWall(); break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
          case 'ShiftLeft': isSprinting = false; break;
        }
      });

      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) shoot();
      });
    }

    // --- 8. SAFE ZONE TIMER & DAMAGE ---
    function updateZoneTimer() {
      if (zoneTimer > 0) {
        zoneTimer--;
      } else {
        // Shrink Zone Radius
        if (zoneRadius > 20) {
          zoneRadius -= 2;
          zoneMesh.scale.set(zoneRadius / 150, 1, zoneRadius / 150);
        }
      }
      document.getElementById('zone-timer').innerText = zoneTimer;

      // Check if Player is Outside Zone
      const distFromCenter = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
      if (distFromCenter > zoneRadius) {
        hp = Math.max(0, hp - 3); // Take Zone Damage Ticks
        updateHealthUI();
        if (hp <= 0) alert("Eliminated by Playzone!");
      }
    }

    function updateHealthUI() {
      document.getElementById('hp-bar').style.width = `${hp}%`;
      document.getElementById('hp-text').innerText = `${hp} / ${maxHp}`;
    }

    // --- 9. MAIN GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isLocked) {
        // Player Rotation
        player.rotation.y = yaw;

        // Camera Positioning (Third Person relative to Player)
        const cameraOffset = new THREE.Vector3(0, 2.5, 4.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.position.copy(player.position).add(cameraOffset);
        camera.rotation.set(pitch, yaw, 0, 'YXZ');

        // Movement Vector Calculation
        const moveSpeed = isSprinting ? 12 : 6;
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.add(forward);
        if (moveBackward) moveDir.sub(forward);
        if (moveRight) moveDir.add(side);
        if (moveLeft) moveDir.sub(side);
        moveDir.normalize();

        player.position.addScaledVector(moveDir, moveSpeed * delta);

        // Simple Gravity Physics
        playerVelocity.y -= 20 * delta; // Gravity force
        player.position.y += playerVelocity.y * delta;

        if (player.position.y <= 0) {
          player.position.y = 0;
          playerVelocity.y = 0;
          canJump = true;
        }

        // Bot AI Patrol Movements
        bots.forEach(bot => {
          bot.position.x += bot.userData.dirX * bot.userData.speed * delta * 5;
          bot.position.z += bot.userData.dirZ * bot.userData.speed * delta * 5;

          // Bounce bots back if they wander off bounds
          if (Math.abs(bot.position.x) > 180) bot.userData.dirX *= -1;
          if (Math.abs(bot.position.z) > 180) bot.userData.dirZ *= -1;
        });
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Initialize Game on Load
    window.onload = init;
  </script>
</body>
</html>
